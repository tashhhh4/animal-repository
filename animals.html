<html>
    <head>
        <style>
        @gray-darker:               #444444;
        @gray-dark:                 #696969;
        @gray:                      #999999;
        @gray-light:                #cccccc;
        @gray-lighter:              #ececec;
        @gray-lightest:             lighten(@gray-lighter,4%);


        html {
          background-color: #ffe9e9;
        }

        h1 {
            text-align: center;
            font-size: 40pt;
            font-weight: normal;
        }

        body {
          font-family: 'Roboto','Helvetica Neue', Helvetica, Arial, sans-serif;
          font-style: normal;
          font-weight: 400;
          letter-spacing: 0;
          padding: 1rem;
          text-rendering: optimizeLegibility;
          -webkit-font-smoothing: antialiased;
          -moz-osx-font-smoothing: grayscale;
          -moz-font-feature-settings: "liga" on;
          width: 900px;
          margin: auto;
        }

        p.feedback {
          text-align: center;
        }

        .cards, ul {
          list-style: none;
          margin: 0;
          padding: 0;
        }

        .cards__item {
          background-color: white;
          border-radius: 0.25rem;
          box-shadow: 0 20px 40px -14px rgba(0,0,0,0.25);
          overflow: hidden;
          padding: 1rem;
          margin: 50px;
        }

        .card__title {
          color: @gray-dark;
          font-size: 1.25rem;
          font-weight: 300;
          letter-spacing: 2px;
          text-transform: uppercase;
        }

        .card__text {
          flex: 1 1 auto;
          font-size: 0.95rem;
          line-height: 2;
          margin-top: 1rem;
          margin-bottom: 1.2rem;
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 0 40px;
        }
        </style>
    </head>
    <body>
        <h1>My Animal Repository</h1>
        <ul class="cards">
            <li class="cards__item"><div class="card__title">Bush Baby</div><ul class="card__text"><li><strong>Location:</strong> Africa</li><li><strong>Diet:</strong> Omnivore</li><li><strong>Type:</strong> Mammal</li><li><strong>Litter_size:</strong> 2</li><li><strong>Weight:</strong> 3.5oz to 3lbs</li><li><strong>Length:</strong> 5in-8in</li><li><strong>Prey:</strong> Fruit, gum, insects and frogs</li><li><strong>Estimated_population_size:</strong> Unknown</li></ul></li>

        </ul>
    </body>
</html>
